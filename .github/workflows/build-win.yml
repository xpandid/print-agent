name: printer-agent-win

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-win:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deps (skip native install script, patched + rebuilt below)
        run: npm install --ignore-scripts

      - name: Sync version from tag (tags are the source of truth)
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e "const fs=require('fs');const t=process.env.GITHUB_REF_NAME.slice(1);const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=t;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');console.log('version',t)"

      - name: Patch native binding (C++17 + python3 + this->_value)
        run: node scripts/patch-binding.js

      - name: Build Windows installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder

      - name: List dist
        if: always()
        run: Get-ChildItem dist -Recurse | Select-Object FullName, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error

      - name: Release installers
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap

  build-mac:
    runs-on: macos-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deps (skip native install script, patched + rebuilt below)
        run: npm install --ignore-scripts

      - name: Sync version from tag (tags are the source of truth)
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e "const fs=require('fs');const t=process.env.GITHUB_REF_NAME.slice(1);const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=t;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');console.log('version',t)"

      - name: Patch native binding (C++17 + python3 + this->_value)
        run: node scripts/patch-binding.js

      - name: Build macOS dmg (dev/testing only)
        run: npx electron-builder --mac dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List dist
        if: always()
        run: ls -la dist

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: |
            dist/*.dmg
            dist/latest-mac.yml
            dist/*.blockmap
          if-no-files-found: error

      - name: Release dmg
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/latest-mac.yml
            dist/*.blockmap
